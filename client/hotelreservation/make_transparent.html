<!DOCTYPE html>
<html>
<head>
    <title>Remove Logo Background</title>
</head>
<body>
    <h2>Logo Background Remover</h2>
    <p>This will remove the dark background from logoAe.png</p>
    <input type="file" id="fileInput" accept="image/png">
    <br><br>
    <canvas id="canvas" style="display:none;"></canvas>
    <br>
    <button id="download" style="display:none;">Download Transparent Logo</button>
    <br><br>
    <div id="preview"></div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const downloadBtn = document.getElementById('download');
        const preview = document.getElementById('preview');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    
                    ctx.drawImage(img, 0, 0);
                    
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;
                    
                    // Remove dark backgrounds (blue, black, dark colors)
                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        
                        // If pixel is dark (not gold/yellow/white)
                        // Check if it's background color
                        const isDark = (r < 100 && g < 100 && b < 150);
                        const isBackground = (Math.abs(r - g) < 30 && Math.abs(g - b) < 50);
                        
                        if (isDark && isBackground) {
                            // Make transparent
                            data[i + 3] = 0;
                        }
                    }
                    
                    ctx.putImageData(imageData, 0, 0);
                    
                    // Show preview
                    preview.innerHTML = '<h3>Preview (with checkerboard = transparent):</h3>';
                    const previewImg = document.createElement('img');
                    previewImg.src = canvas.toDataURL('image/png');
                    previewImg.style.background = 'repeating-conic-gradient(#ddd 0% 25%, white 0% 50%) 50% / 20px 20px';
                    previewImg.style.padding = '20px';
                    preview.appendChild(previewImg);
                    
                    downloadBtn.style.display = 'block';
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        downloadBtn.addEventListener('click', function() {
            const link = document.createElement('a');
            link.download = 'logoAe_transparent.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            
            alert('Download complete! Now replace the old logoAe.png file with this new transparent version at:\n\nsrc\\assets\\images\\logoAe.png');
        });
    </script>
</body>
</html>
